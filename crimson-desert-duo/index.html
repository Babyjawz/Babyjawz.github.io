</style></head><body><main>
<div class="eyebrow">FIELD GUIDE · INTERACTIVE TRAINING</div><h1>Crimson Desert<br><span style="color:var(--gold)">Duo Academy</span></h1>
<p>Tally-stick training for Crimson Desert: recognise carved red and yellow sticks, master hand rankings and compare hands at a glance.</p>
<div class="tabs" role="tablist"><button data-tab="training" class="active">Practice</button><button data-tab="reference">Rankings</button><button data-tab="catalog">All combinations</button><button data-tab="special">Special rules</button></div>
<section class="panel" id="training"><h2>Practice arena</h2>
<div class="settings"><div><label for="mode">Training mode</label><select id="mode"><option value="name">Name this hand</option><option value="duel">Which hand wins?</option><option value="value">Calculate points</option></select></div><div><label for="level">Practice focus</label><select id="level"><option value="basics">Beginner · pairs & points</option><option value="all" selected>All standard hands</option><option value="named">Named hand mastery</option><option value="tricky">Tricky comparisons</option></select></div></div>
<div class="stats" style="margin-top:16px"><div>Correct<strong id="correct">0</strong></div><div>Attempted<strong id="attempts">0</strong></div><div>Accuracy<strong id="accuracy">—</strong></div><div>Streak<strong id="streak">0</strong></div></div>
<div class="question" id="question"></div><div class="choices" id="choices"></div><div id="feedback" aria-live="polite"></div>
<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;margin-top:18px"><button class="primary" id="next" hidden>Next challenge →</button><button id="reset">Reset score</button></div>
<p class="subtle">Questions are randomised, including the full standard number-pair pool. Special red-card overrides are intentionally excluded from automatic wins until their exact rules can be validated.</p></section>
<section class="panel" id="reference" hidden><h2>Fast hand reference</h2><p>Based on your in-game View Hands screenshot: Prime Pair → Superior Pair → Ten Pair → regular pairs → six named hands → Perfect Nine → Points → Zero. Special hands can override this order.</p><h3>1. Prime & Superior Pairs</h3><div class="rank-grid" id="premiums"></div><h3>2. Ten Pair & regular Pairs</h3><div class="rank-grid" id="pairs"></div><h3>3. Six named combinations</h3><p>Memorise these exact six, in order. They beat all ordinary points.</p><div class="rank-grid" id="named"></div><h3>4. Ordinary points</h3><div class="rank-grid" id="points"></div><p><strong>Rule:</strong> Add the two stick numbers and use only the final digit. Example: 7 + 8 = 15 → 5 points. Pairs and named combinations take priority.</p><div class="warn"><strong>Perfect Nine:</strong> a nine-point ordinary hand, the strongest of its group.</div></section>
<section class="panel" id="catalog" hidden><h2>Every numbered pairing</h2><p><strong id="catalogCount"></strong> unordered number pairings, including identical numbers. Select a hand to see how it ranks. The physical 20-stick deck also has red/yellow variants, so colour-specific effects are documented separately.</p><div class="settings"><div><label for="filter">Show category</label><select id="filter"><option value="all">All</option><option value="pair">Pairs</option><option value="named">Named combinations</option><option value="points">Ordinary points</option><option value="conditional">Conditional specials (base value)</option></select></div></div><div class="rank-grid" id="allhands" style="margin-top:15px"></div></section>
<section class="panel" id="special" hidden><h2>Special Hands — in-game rules</h2><p>Transcribed from the View Hands screenshot you provided. These conditional hands can beat or trigger rematches against otherwise stronger hands.</p><div class="rank-grid" id="specialGuide"></div><div class="warn">The precise physical red/yellow placement matters. The trainer distinguishes fully red pairs from mixed sticks for premium hands.</div></section>
<footer>Unofficial fan-made guide. Reference reading: <a href="https://www.keengamer.com/articles/guides/crimson-desert-gambling-guide-how-to-win-duo-and-five-card/" target="_blank" rel="noopener">KeenGamer</a>, <a href="https://www.gamespot.com/gallery/crimson-desert-duo-five-card-minigame/2900-7576/" target="_blank" rel="noopener">GameSpot</a>, <a href="https://steamcommunity.com/app/3321460/discussions/0/805721739935986715/" target="_blank" rel="noopener">Community discussion</a>. Scores are saved locally in your browser; no account or tracking.</footer></main>
<script>
"use strict";
const $=id=>document.getElementById(id);
const named=[[1,2,'One-Two'],[1,4,'One-Four'],[1,9,'One-Nine'],[1,10,'One-Ten'],[4,10,'Four-Ten'],[4,6,'Four-Six']];
const special=[[3,7],[4,7],[4,9],[1,3],[1,8],[3,8]];
const all=[];for(let a=1;a<=10;a++)for(let b=a;b<=10;b++)all.push([a,b]);
const key=h=>h.join('-');const isSpecial=h=>special.some(x=>key(x)===key(h));
function details(h){let [a,b]=h;if(a===b)return{group:'pair',name:a===10?'Ten Pair':a+' Pair',rank:100+a,description:'Matching numbers make a pair. Higher pairs beat lower pairs.'};let n=named.findIndex(x=>x[0]===a&&x[1]===b);if(n>=0)return{group:'named',name:named[n][2],rank:90-n,description:'Named combination #'+(n+1)+' of six. All named combinations beat ordinary points.'};let p=(a+b)%10;return{group:'points',name:p===9?'Perfect Nine':p===0?'Zero':p+' Points',rank:p,description:a+' + '+b+' = '+(a+b)+'. Keep the last digit: '+p+' points.'}}
function tallySvg(n,color){
 const red=color==='red',fill=red?'#ae3430':'#bb9133';
 function marks(count,y){
  let xs=count===5?[15,21,27,33]:Array.from({length:count},(_,i)=>24-(count-1)*3.7+i*7.4);
  let s=xs.map((x,i)=>'<path d="M'+x+' '+(y+(i%2?0.7:-0.5))+' l'+(i%2?-.4:.5)+' 17"/>').join('');
  if(count===5)s+='<path d="M12 '+(y+16)+' L36 '+(y+2)+'"/>';
  return s;
 }
 let remaining=n,y=n>5?15:28, strokes='';
 while(remaining>=5){strokes+=marks(5,y);remaining-=5;y+=25}
 if(remaining)strokes+=marks(remaining,y);
 return '<svg class="duo-stick" viewBox="0 0 48 81" role="img" aria-label="'+n+' tally marks on '+(red?'red':'gold')+' stick" xmlns="http://www.w3.org/2000/svg">'+
 '<path fill="'+fill+'" d="M10 3 Q13 1 18 2 L29 2 Q36 1 39 4 Q43 6 43 13 L43 63 Q44 67 42 71 L42 78 L37 76 L33 79 L29 77 L25 79 L20 77 L15 79 L11 77 L7 79 L7 69 Q6 65 6 61 L6 14 Q6 8 10 3Z"/>'+
 '<g fill="none" stroke="#fff9ef" stroke-width="2.65" stroke-linecap="round" stroke-linejoin="round">'+strokes+'</g></svg>';
}
function tile(n,color){return tallySvg(n,color==='red'?'red':'yellow')}
function card(h,colors){return '<div class="hand">'+h.map((n,i)=>tile(n,colors?colors[i]:(i%2?'red':'yellow'))).join('')+'</div>'}
function sample(list){return list[Math.floor(Math.random()*list.length)]}function randomise(arr){let a=arr.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const safe=all.filter(h=>!isSpecial(h));function pool(){let v=$('level').value;if(v==='basics')return safe.filter(h=>details(h).group!=='named');if(v==='named')return safe.filter(h=>details(h).group==='named');return safe}
let s={correct:0,attempts:0,streak:0};try{let stored=JSON.parse(localStorage.getItem('duoAcademyV2'));if(stored&&Number.isInteger(stored.attempts)&&Number.isInteger(stored.correct))s=stored}catch(e){}
let active=null,answered=false,correctLabel='';
function update(){['correct','attempts','streak'].forEach(k=>$(k).textContent=s[k]);$('accuracy').textContent=s.attempts?Math.round(s.correct/s.attempts*100)+'%':'—';try{localStorage.setItem('duoAcademyV2',JSON.stringify(s))}catch(e){}}
function qName(){let list=pool(), h=sample(list),d=details(h);let distractors=all.map(details).filter(x=>x.name!==d.name).map(x=>x.name);let options=[d.name,...randomise([...new Set(distractors)]).slice(0,3)];return{prompt:'What is this hand?',visual:card(h),options:randomise(options),correct:d.name,explain:d.description}}
function qPoints(){let list=safe.filter(h=>details(h).group==='points');let h=sample(list),p=(h[0]+h[1])%10;return{prompt:'What is the ordinary point value?',visual:card(h),options:randomise([p+' points',...randomise([...Array(10).keys()].filter(x=>x!==p)).slice(0,3).map(x=>x+' points')]),correct:p+' points',explain:h.join(' + ')+' = '+(h[0]+h[1])+'; last digit = '+p+'.'}}
function qDuel(){let list=pool(),a,b,da,db;for(let i=0;i<500;i++){a=sample(list);b=sample(list);if(key(a)===key(b))continue;da=details(a);db=details(b);if($('level').value==='tricky'&&i<300&&Math.abs(da.rank-db.rank)>5)continue;break}
let comparison=da.rank===db.rank?'Tie':da.rank>db.rank?'Hand A':'Hand B';
return{prompt:'Which hand ranks higher?',visual:'<div id="duel"><div class="duelSide"><strong>Hand A</strong>'+card(a)+'</div><strong>VS</strong><div class="duelSide"><strong>Hand B</strong>'+card(b)+'</div></div>',options:['Hand A','Hand B','Tie'],correct:comparison,explain:'A is '+da.name+'; B is '+db.name+'. '+(comparison==='Tie'?'Both have equal rank.':comparison+' outranks the other.')}}
function newQuestion(){answered=false;let mode=$('mode').value;active=mode==='duel'?qDuel():mode==='value'?qPoints():qName();$('question').innerHTML='<h2>'+active.prompt+'</h2>'+active.visual;$('choices').innerHTML='';active.options.forEach(o=>{let btn=document.createElement('button');btn.textContent=o;btn.addEventListener('click',()=>answer(o));$('choices').appendChild(btn)});$('feedback').innerHTML='';$('next').hidden=true}
function answer(pick){if(answered)return;answered=true;s.attempts++;if(pick===active.correct){s.correct++;s.streak++}else s.streak=0;[...$('choices').children].forEach(b=>{b.disabled=true;if(b.textContent===active.correct)b.classList.add('correct');else if(b.textContent===pick)b.classList.add('wrong')});$('feedback').innerHTML='<div class="feedback"><strong>'+(pick===active.correct?'Correct!':'Not quite — '+active.correct)+'</strong><br>'+active.explain+'</div>';$('next').hidden=false;update()}
$('next').onclick=newQuestion;$('reset').onclick=()=>{if(!confirm('Reset your practice score?'))return;s={correct:0,attempts:0,streak:0};update();newQuestion()};$('mode').onchange=newQuestion;$('level').onchange=newQuestion;
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));['training','reference','catalog','special'].forEach(id=>$(id).hidden=id!==b.dataset.tab)});
$('premiums').innerHTML='<div><span>Rank 1</span>'+card([3,8],['red','red'])+'<strong>Prime Pair</strong><br><small>Red 3 + red 8. Guaranteed winner.</small></div><div><span>Rank 2</span>'+card([1,3],['red','red'])+'<strong>Superior Pair</strong><br><small>Red 1 + red 3, or red 1 + red 8.</small></div>';
$('specialGuide').innerHTML=[['Warden',[4,9],['mixed','mixed'],'Rematch against anything below One-Two; otherwise counts as points.'],['High Warden',[4,9],['red','red'],'Red 4 + red 9. Rematch against hands below Nine Pair; loses to Ten Pair.'],['Judge',[3,7],['mixed','mixed'],'Beats pairs from 1 Pair through 9 Pair; otherwise counts as points.'],['Executor',[4,7],['red','red'],'Red 4 + red 7. Beats Superior Pair, excluding Prime Pair; otherwise counts as points.']].map(x=>'<div><span>'+x[0]+'</span>'+card(x[1],x[2])+'<small>'+x[3]+'</small></div>').join('');
$('pairs').innerHTML=Array.from({length:10},(_,i)=>10-i).map(n=>'<div><span>'+n+' + '+n+'</span>'+card([n,n])+'<strong>'+details([n,n]).name+'</strong></div>').join('');
$('named').innerHTML=named.map((h,i)=>'<div><span>#'+(i+1)+' · '+h[0]+' + '+h[1]+'</span>'+card([h[0],h[1]])+'<strong>'+h[2]+'</strong></div>').join('');
$('points').innerHTML=Array.from({length:10},(_,i)=>9-i).map(n=>{let h=all.find(h=>!isSpecial(h)&&details(h).group==='points'&&details(h).rank===n);return '<div><span>'+(n===9?'Perfect Nine':n===0?'Zero':n+' Points')+'</span>'+(h?card(h):'')+'<small>Ordinary value '+n+'</small></div>'}).join('');
$('catalogCount').textContent=all.length;
function catalogue(){let filter=$('filter').value,found=all.filter(h=>filter==='all'||filter==='conditional'&&isSpecial(h)||filter!=='conditional'&&!isSpecial(h)&&details(h).group===filter);$('allhands').innerHTML=found.map(h=>{let d=details(h);return'<div><span>'+h.join(' + ')+'</span>'+card(h)+'<strong>'+d.name+'</strong>'+(isSpecial(h)?'<br><small>Special condition may override</small>':'')+'</div>'}).join('')}
$('filter').onchange=catalogue;catalogue();update();newQuestion();
</script></body></html>
